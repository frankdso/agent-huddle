name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never
      # Publish in one step: creates the tag and release if needed, then uploads all files.
      # (electron-builder's own publisher uploads in parallel and can create duplicate releases.)
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          FILES=(dist/Agent-Huddle-Setup-"$VERSION".exe dist/Agent-Huddle-Setup-"$VERSION".exe.blockmap dist/latest.yml)
          ls -la "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
